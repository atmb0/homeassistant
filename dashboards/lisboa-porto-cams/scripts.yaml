# Optional: opens the current airport live on an Android TV (adapt the media_player entities)
alias: TV Aeroporto
icon: mdi:airplane
mode: single
sequence:
- action: media_player.play_media
  target:
    entity_id: media_player.tv
  data:
    media_content_type: url
    media_content_id: https://www.youtube.com/watch?v={{ states('sensor.lisbon_airport_live_id') }}
